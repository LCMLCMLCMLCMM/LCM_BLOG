{% extends 'base.html' %}

{% block title %}编辑文章 - LCM's Blog{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h2>编辑文章</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="title">标题:</label>
                <input type="text" id="title" name="title" value="{{ post.title }}" required>
            </div>
            <div class="form-group">
                <label for="content">内容:</label>
                <textarea id="content" name="content" rows="10" required>{{ post.content }}</textarea>
            </div>
            <button type="submit" class="btn">更新文章</button>
        </form>
        <a href="{% url 'post_detail' post.id %}" class="btn btn-secondary">取消</a>
    </div>
</div>
{% endblock %}
